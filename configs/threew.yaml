# 3W v2.0.0 ingestion, cleaning and windowing.
raw_dir: data/raw/3w/dataset

# Where the Delta tables live: a path root for local runs, or a Unity Catalog schema on Databricks
# (set catalog + schema and path_root is ignored).
tables:
  path_root: data/delta
  catalog: null
  schema: null

# The 3W variables we model and the physical limits used to reject impossible readings.
# Pressures are converted from Pa to bar on ingest; limits are in the converted unit.
sensors:
  P-PDG:      {column: p_pdg,      kind: pressure,    min: 1.0,  max: 1000.0}
  P-TPT:      {column: p_tpt,      kind: pressure,    min: 1.0,  max: 1000.0}
  T-TPT:      {column: t_tpt,      kind: temperature, min: -5.0, max: 200.0}
  P-MON-CKP:  {column: p_mon_ckp,  kind: pressure,    min: 1.0,  max: 1000.0}
  T-JUS-CKP:  {column: t_jus_ckp,  kind: temperature, min: -5.0, max: 200.0}
  P-JUS-CKGL: {column: p_jus_ckgl, kind: pressure,    min: 1.0,  max: 1000.0}
  QGL:        {column: qgl,        kind: flow,        min: 0.0,  max: 20.0}

cleaning:
  # A pressure or temperature value repeated for this long is a stuck gauge, not a quiet well.
  # Gas-lift rate is exempt: it legitimately sits at zero when lift is off.
  frozen_min_seconds: 600
  frozen_kinds: [pressure, temperature]
  min_sensor_coverage: 0.5   # a sensor must be valid for this share of a run, or it is dropped for the run
  min_valid_sensors: 3       # runs with fewer usable sensors are dropped
  resample_seconds: 10

windows:
  length_seconds: 600
  step_seconds: 60
  baseline_seconds: 1800     # trailing context before each window, used for drift features
  min_coverage: 0.5          # per-sensor share of valid 10 s buckets for a window feature to count
  min_valid_sensors: 3

spark:
  partitions: 64
